plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

apply from: '../../gradle/load-common.gradle'

version = "v${mod_version}"
group = mod_group_id

base {
    archivesName = "BlastTravel-NeoForge-1.21.1"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = neo_version

    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }

    accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
        data { data(); programArguments.addAll '--mod', mod_id, '--all', '--output', file('src/generated/resources/').absolutePath, '--existing', file('src/main/resources/').absolutePath }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets {
    main {
        java { srcDir '../../shared/java/common' }
        resources {
            srcDir '../../shared/resources'
            srcDir 'src/generated/resources'
        }
    }
}

tasks.named('processResources', ProcessResources).configure {
    def props = [
            minecraft_version: minecraft_version,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_license: mod_license,
            mod_version: mod_version,
            mod_authors: mod_authors,
            mod_description: mod_description
    ]
    inputs.properties props
    filesMatching('META-INF/neoforge.mods.toml') { expand props }
}

tasks.named('jar', Jar).configure {
    archiveFileName = "BlastTravel-NeoForge-1.21.1-v${mod_version}.jar"
}

repositories { }

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
